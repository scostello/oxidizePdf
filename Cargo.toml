[workspace]
members = [
    "oxidize-pdf-core",
    "oxidize-pdf-editor",
]
exclude = [
    "lints",  # Dylint lints workspace (requires nightly)
    "dev-tools/iso-curator",  # ISO matrix curation tool (standalone)
]
resolver = "2"

[workspace.package]
version = "1.6.11"
edition = "2024"
rust-version = "1.91"  # MSRV - Edition 2024, cargo-nextest compatibility
authors = ["Santiago Fernández Muñoz"]
license = "AGPL-3.0"
repository = "https://github.com/bzsanti/oxidizePdf"
homepage = "https://oxidizepdf.dev"
documentation = "https://docs.oxidizepdf.dev"
readme = "README.md"
keywords = ["pdf", "document", "generation", "graphics", "text"]
categories = ["graphics", "text-processing", "encoding"]

[workspace.dependencies]
# Core dependencies
thiserror = "2.0.18"
anyhow = "1.0.100"
chrono = { version = "0.4.43", features = ["serde"] }
lazy_static = "1.5.0"

# CLI dependencies
clap = { version = "4.5.54", features = ["derive"] }

# API dependencies
axum = "0.8.4"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1.49.0", features = ["full"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Compression (optional)
flate2 = "1.1.8"

# Image processing (optional)
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }

# Testing
tempfile = "3.24.0"
pretty_assertions = "1.4.1"
proptest = "1.9.0"
criterion = { version = "0.5.1", features = ["html_reports"] }
insta = "1.41.1"

# Utilities
rand = "0.9.2"
hex = "0.4.3"
regex = "1.12.2"

# Pro dependencies
base64 = "0.22.1"
uuid = { version = "1.19.0", features = ["v4"] }
quick-xml = { version = "0.31.0", features = ["serialize"] }
reqwest = { version = "0.12.12", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true

[workspace.metadata.dylint]
libraries = [
    { path = "lints" }
]

[workspace.metadata.release]
# Don't sign commits or tags (requires GPG setup)
sign-commit = false
sign-tag = false

# Commit messages
pre-release-commit-message = "chore: Release {{version}}"
pre-release-replacements = [
    {file="CHANGELOG.md", search="Unreleased", replace="{{version}}", min=1},
    {file="CHANGELOG.md", search="\\.\\.\\.HEAD", replace="...v{{version}}", exactly=1},
    {file="CHANGELOG.md", search="ReleaseDate", replace="{{date}}", min=1},
    {file="CHANGELOG.md", search="<!-- next-header -->", replace="<!-- next-header -->\n## [Unreleased] - ReleaseDate\n", exactly=1},
    {file="README.md", search="oxidize-pdf = \"[0-9.]+\"", replace="oxidize-pdf = \"{{version}}\"", exactly=1},
]

# Tag configuration
tag-message = "Release v{{version}}"
tag-name = "v{{version}}"

# Consolidate commits when releasing workspace
consolidate-commits = true

# Push options
push = true
push-remote = "origin"

# Publishing
publish = true
