[package]
name = "oxidize-pdf-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false  # Not ready for public release - still in development (Phase 1 of 8)

[dependencies]
# PDF processing
oxidize-pdf = { path = "../oxidize-pdf-core" }

# GUI framework
iced = { version = "0.14.0", features = ["tokio", "image"] }

# Async runtime
tokio = { version = "1.49.0", features = ["full"] }

# File dialogs
rfd = "0.17.2"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.18"

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[[bin]]
name = "oxidize-pdf-editor"
path = "src/main.rs"
