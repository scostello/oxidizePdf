[package]
name = "oxidize-pdf-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false  # Not ready for public release - still in development (Phase 1 of 8)

[features]
default = ["pdfium-render"]
pdfium-render = ["dep:pdfium-render"]
native-render = ["dep:tiny-skia", "dep:skrifa"]

[dependencies]
# PDF processing
oxidize-pdf = { path = "../oxidize-pdf-core" }

# PDF rendering - pdfium backend (default)
pdfium-render = { version = "0.8", features = ["image"], optional = true }

# PDF rendering - native backend (pure Rust)
tiny-skia = { version = "0.11", optional = true }
skrifa = { version = "0.26", optional = true }

# GUI framework
iced = { version = "0.14.0", features = ["tokio", "image"] }

# Image handling
image = "0.25"

# Async runtime
tokio = { version = "1.49.0", features = ["full"] }

# File dialogs
rfd = "0.17.2"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.18"

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
iced_test = "0.14"

[lib]
name = "oxidize_pdf_editor"
path = "src/lib.rs"

[[bin]]
name = "oxidize-pdf-editor"
path = "src/main.rs"

[[example]]
name = "native_render_visual"
required-features = ["native-render"]
